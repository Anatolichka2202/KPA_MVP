[yav]
name = ГУИ_ЯВ-1
log_file = yav_gui.log

# Режим работы ЯЛС: emulate | real
yls_mode = emulate

# Если yls_mode = real
yls_ip = 192.168.0.200
yls_port = 16000

# Если yls_mode = emulate
[emulated_bkd]
# Формат: blockX = ip:port
block0 = 192.168.0.100:15000
block1 = 192.168.0.101:15000
block1 = 192.168.0.102:15000
block1 = 192.168.0.103:15000
block1 = 192.168.0.104:15000
block1 = 192.168.0.105:15000
block1 = 192.168.0.106:15000
block1 = 192.168.0.107:15000
block1 = 192.168.0.108:15000
block1 = 192.168.0.109:15000
block1 = 192.168.0.110:15000
block1 = 192.168.0.111Я:15000

[graphics]
update_interval_ms = 30000  # 30 секунд
enable_animations = true

[network]
send_interval_ms = 20
timeout_ms = 100
retry_count = 3

[timing]
data_interval_ms = 20      # 50 Гц - обмен данными
gui_redraw_interval_ms = 50 # 20 Гц - перерисовка виджетов
chart_update_interval_ms = 2000 # 0.5 Гц - обновление графиков (если есть история)
